  <circle cx="15" cy="45" r="3"  fill="#F25C05"/>
  <line x1="15" y1="35" x2="15" y2="55" stroke="#F25C05" stroke-width="1.2"/>
  <line x1="5"  y1="45" x2="25" y2="45" stroke="#F25C05" stroke-width="1.2"/>

  <!-- Rueda delantera -->
  <circle cx="50" cy="45" r="10" fill="none" stroke="#F25C05" stroke-width="2.5"/>
  <circle cx="50" cy="45" r="3"  fill="#F25C05"/>
